version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      dev-deps:
        dependency-type: "development"
      prod-deps:
        dependency-type: "production"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/spacetimedb"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(stdb)"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/cloud_run/scene_gen"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(scene-gen)"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/cloud_run/scene_gen"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(scene-gen)"
    open-pull-requests-limit: 3
