name: Deploy Karlsruhe Event

on:
  push:
    branches:
      - release/karlsruhe

jobs:
  deploy:
    name: Deploy Karlsruhe Platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'detective-prod-8f6f0' }}
      STDB_VERSION: "2.0.1"
      STDB_UPDATER_SHA256: "1ec25f3b7060e651887b04492e38257f6ee81e35daf73e52d682d20d50475fbd"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify GCP Secrets
        run: |
          if [ -z "${{ secrets.GCP_CREDENTIALS }}" ]; then
            echo "::error::GCP_CREDENTIALS secret is empty!"
            exit 1
          fi

      - name: Google Auth
        uses: google-github-actions/auth@7b53cdc2a387814ed14eec026287aac689ae8c9b # v2.1.9
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Authorize Docker
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev

      - name: Build and Push Container
        run: |
          docker build -t europe-west3-docker.pkg.dev/${PROJECT_ID}/grenzwanderer/karlsruhe-scene-gen:${{ github.sha }} ./cloud_run/scene_gen
          docker push europe-west3-docker.pkg.dev/${PROJECT_ID}/grenzwanderer/karlsruhe-scene-gen:${{ github.sha }}

      - name: Deploy to Cloud Run
        if: ${{ vars.APP_CHECK_BYPASS_SECRET_REF == '' }}
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: karlsruhe-scene-gen
          image: europe-west3-docker.pkg.dev/${{ env.PROJECT_ID }}/grenzwanderer/karlsruhe-scene-gen:${{ github.sha }}
          region: europe-west3
          project_id: ${{ env.PROJECT_ID }}
          env_vars: |-
            SENTRY_ENABLED=${{ secrets.SENTRY_DSN != '' }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_ENVIRONMENT=production
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_TRACES_SAMPLE_RATE=0
            APP_CHECK_ENFORCE=${{ vars.APP_CHECK_ENFORCE || 'false' }}
            APP_CHECK_PROJECT_NUMBER=${{ secrets.APP_CHECK_PROJECT_NUMBER }}
          flags: --allow-unauthenticated

      - name: Deploy to Cloud Run with App Check bypass secret
        if: ${{ vars.APP_CHECK_BYPASS_SECRET_REF != '' }}
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: karlsruhe-scene-gen
          image: europe-west3-docker.pkg.dev/${{ env.PROJECT_ID }}/grenzwanderer/karlsruhe-scene-gen:${{ github.sha }}
          region: europe-west3
          project_id: ${{ env.PROJECT_ID }}
          env_vars: |-
            SENTRY_ENABLED=${{ secrets.SENTRY_DSN != '' }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_ENVIRONMENT=production
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_TRACES_SAMPLE_RATE=0
            APP_CHECK_ENFORCE=${{ vars.APP_CHECK_ENFORCE || 'false' }}
            APP_CHECK_PROJECT_NUMBER=${{ secrets.APP_CHECK_PROJECT_NUMBER }}
          secrets: |-
            APP_CHECK_BYPASS_SECRET=${{ vars.APP_CHECK_BYPASS_SECRET_REF }}
          flags: --allow-unauthenticated

      # --- Frontend Steps ---

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Install SpacetimeDB CLI (pinned)
        run: |
          set -euo pipefail
          install_dir="$HOME/.local/bin"
          mkdir -p "$install_dir"
          bin="$install_dir/spacetime"
          curl -fsSL -o "$bin" \
            "https://github.com/clockworklabs/SpacetimeDB/releases/download/v${STDB_VERSION}/spacetimedb-update-x86_64-unknown-linux-gnu"
          echo "${STDB_UPDATER_SHA256}  $bin" | sha256sum -c -
          chmod +x "$bin"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$bin" version install "${STDB_VERSION}"
          "$bin" version use "${STDB_VERSION}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare release config
        run: bun run release:config:prepare
        env:
          RELEASE_PROFILE: karlsruhe_event
          KARLSRUHE_ENTRY_TOKEN: ${{ secrets.KARLSRUHE_ENTRY_TOKEN }}

      - name: Build Frontend
        run: bun run build:karlsruhe
        env:
          VITE_RELEASE_PROFILE: karlsruhe_event
          VITE_SPACETIMEDB_HOST: wss://maincloud.spacetimedb.com
          VITE_SPACETIMEDB_DB_NAME: grezwandererdata-karlsruhe
          VITE_SCENE_GEN_BASE_URL: /api
          VITE_APP_CHECK_ENABLED: ${{ vars.APP_CHECK_FRONTEND_ENABLED || 'false' }}
          VITE_FIREBASE_API_KEY: ${{ vars.KARLSRUHE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.KARLSRUHE_FIREBASE_APP_ID }}
          VITE_FIREBASE_PROJECT_ID: detective-prod-8f6f0
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.KARLSRUHE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_KARLSRUHE_ENTRY_TOKEN: ${{ secrets.KARLSRUHE_ENTRY_TOKEN }}

      - name: Deploy to Firebase (Manual)
        run: |
          trap 'rm -f gcp-key.json' EXIT
          echo '${{ secrets.GCP_CREDENTIALS }}' > gcp-key.json
          GOOGLE_APPLICATION_CREDENTIALS=gcp-key.json bun x --no-install -p firebase-tools firebase deploy --only hosting:karlsruhe-event --project "${PROJECT_ID}" --non-interactive
