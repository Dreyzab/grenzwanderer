name: Deploy Production (Freiburg)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      STDB_VERSION: "2.0.1"
      STDB_UPDATER_SHA256: "1ec25f3b7060e651887b04492e38257f6ee81e35daf73e52d682d20d50475fbd"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install SpacetimeDB module dependencies
        working-directory: spacetimedb
        run: npm ci

      - name: Patch SpacetimeDB Option None defaults (nested + root node_modules)
        run: bun run scripts/patch-spacetimedb-table-defaults.ts

      - name: Install SpacetimeDB CLI (pinned)
        run: |
          set -euo pipefail
          install_dir="$HOME/.local/bin"
          mkdir -p "$install_dir"
          bin="$install_dir/spacetime"
          curl -fsSL -o "$bin" \
            "https://github.com/clockworklabs/SpacetimeDB/releases/download/v${STDB_VERSION}/spacetimedb-update-x86_64-unknown-linux-gnu"
          echo "${STDB_UPDATER_SHA256}  $bin" | sha256sum -c -
          chmod +x "$bin"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$bin" version install "${STDB_VERSION}"
          "$bin" version use "${STDB_VERSION}"

      - name: Publish SpacetimeDB Module
        env:
          STDB_OPERATOR_TOKEN: ${{ secrets.STDB_OPERATOR_TOKEN }}
        run: |
          # Use operator token for maincloud publishing
          # Note: STDB_OPERATOR_TOKEN must be configured in repository secrets
          spacetime login --token "$STDB_OPERATOR_TOKEN"
          bun run spacetime:publish

      - name: Sync Narrative Content
        env:
          SPACETIMEDB_OPERATOR_TOKEN: ${{ secrets.STDB_OPERATOR_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          bun run content:release:freiburg -- --version $VERSION
      - name: Build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_RELEASE_PROFILE: "freiburg_detective"
          VITE_SPACETIMEDB_HOST: "wss://maincloud.spacetimedb.com"
          VITE_SPACETIMEDB_DB_NAME: "grezwandererdata"
        run: bun run build:freiburg

      - name: Google Auth
        uses: google-github-actions/auth@7b53cdc2a387814ed14eec026287aac689ae8c9b # v2.1.9
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Deploy to Firebase
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: bun run deploy:firebase:freiburg
