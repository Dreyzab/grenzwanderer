name: PR Preview Artifact

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    env:
      VITE_SPACETIMEDB_HOST: "ws://localhost:3000"
      VITE_SPACETIMEDB_DB_NAME: "grezwandererdata"
      VITE_ENABLE_AI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend artifact
        run: bun run build

      - name: Resolve artifact name
        id: artifact
        run: echo "name=grenzwanderer-pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist
          retention-days: 14
