<?xml version="1.0" encoding="UTF-8"?>
<!--
  Train hub side-view cutaway for VnHubSchema.
  Coordinates target viewBox "0 0 2400 1000".

  Zones:
    compartment  : x 80..820,  y 240..780
    corridor     : x 820..1320, y 280..780
    dining_car   : x 1320..2000,y 220..780
    vestibule    : x 2000..2360,y 300..780

  Text labels are intentionally not baked into this asset. The VN overlay
  supplies labels, tooltips, localization, current-zone markers, and hit areas.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1000" role="img" aria-label="Train side-view cutaway">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172635" />
      <stop offset="0.56" stop-color="#253746" />
      <stop offset="1" stop-color="#121922" />
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e4a2d" />
      <stop offset="0.48" stop-color="#4b3121" />
      <stop offset="1" stop-color="#22160f" />
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2026" />
      <stop offset="1" stop-color="#0d0f13" />
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1a1" />
      <stop offset="1" stop-color="#bd7a32" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect width="2400" height="1000" fill="url(#sky)" />
  <g opacity="0.16">
    <path d="M0 178 C320 128 560 220 890 176 S1460 122 1840 176 2240 220 2400 176 V0 H0 Z" fill="#d7e1e7" />
    <path d="M0 250 C390 214 600 290 950 244 S1540 202 1910 252 2230 292 2400 252 V172 H0 Z" fill="#d7e1e7" />
  </g>

  <g transform="translate(0 20)" filter="url(#soft-shadow)">
    <path d="M72 260 Q116 198 202 190 H2250 Q2332 190 2368 258 V784 H72 Z" fill="url(#body)" />
    <path d="M156 178 H2250 Q2324 178 2368 258 H72 Q98 206 156 178 Z" fill="url(#roof)" />
    <path d="M82 264 H2358" stroke="#c8964f" stroke-width="8" opacity="0.72" />
    <path d="M82 782 H2358" stroke="#120c08" stroke-width="18" opacity="0.68" />

    <g id="compartment-zone">
      <rect x="112" y="318" width="150" height="160" rx="10" fill="url(#window)" opacity="0.9" />
      <rect x="292" y="318" width="150" height="160" rx="10" fill="url(#window)" opacity="0.86" />
      <rect x="472" y="318" width="150" height="160" rx="10" fill="url(#window)" opacity="0.86" />
      <rect x="652" y="318" width="128" height="160" rx="10" fill="url(#window)" opacity="0.8" />
      <path d="M110 528 H790" stroke="#e8b967" stroke-width="5" opacity="0.24" />
    </g>

    <g id="corridor-zone">
      <rect x="850" y="330" width="430" height="112" rx="8" fill="url(#window)" opacity="0.48" />
      <path d="M870 528 H1270" stroke="#e8b967" stroke-width="5" opacity="0.18" />
      <path d="M820 280 V780 M1320 280 V780" stroke="#21150e" stroke-width="6" opacity="0.42" />
    </g>

    <g id="dining-zone">
      <rect x="1362" y="300" width="168" height="184" rx="10" fill="url(#window)" opacity="0.9" />
      <rect x="1562" y="300" width="168" height="184" rx="10" fill="url(#window)" opacity="0.92" />
      <rect x="1762" y="300" width="196" height="184" rx="10" fill="url(#window)" opacity="0.88" />
      <g fill="#1c120c" opacity="0.42">
        <rect x="1400" y="542" width="210" height="18" rx="9" />
        <rect x="1645" y="542" width="252" height="18" rx="9" />
      </g>
    </g>

    <g id="vestibule-zone">
      <rect x="2042" y="382" width="118" height="314" rx="6" fill="#17100c" stroke="#d99f4e" stroke-width="4" opacity="0.9" />
      <rect x="2202" y="382" width="118" height="314" rx="6" fill="#17100c" stroke="#d99f4e" stroke-width="4" opacity="0.9" />
      <circle cx="2142" cy="542" r="9" fill="#d99f4e" opacity="0.84" />
      <circle cx="2220" cy="542" r="9" fill="#d99f4e" opacity="0.84" />
    </g>

    <g opacity="0.34" stroke="#f4ecd8" stroke-width="2">
      <path d="M112 246 H2328" />
      <path d="M96 806 H2360" />
    </g>
  </g>

  <g opacity="0.42" stroke="#7d5a31" stroke-width="5">
    <line x1="0" y1="862" x2="2400" y2="862" />
    <line x1="0" y1="908" x2="2400" y2="908" />
  </g>
  <g fill="#16100b" opacity="0.88">
    <circle cx="320" cy="836" r="46" />
    <circle cx="700" cy="836" r="46" />
    <circle cx="1120" cy="836" r="46" />
    <circle cx="1520" cy="836" r="46" />
    <circle cx="1900" cy="836" r="46" />
    <circle cx="2260" cy="836" r="46" />
  </g>
</svg>
